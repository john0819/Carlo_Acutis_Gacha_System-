# Nginx HTTPS配置文件 - 生产环境
# 位置: /etc/nginx/sites-available/h5project
# 使用说明：
# 1. 如果有域名，使用 Let's Encrypt 免费证书
# 2. 如果只有IP，使用自签名证书（浏览器会显示警告，但功能正常）

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name _;  # 替换为你的域名或IP
    
    # 如果是Let's Encrypt验证，允许访问
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # 其他请求重定向到HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 配置
server {
    listen 443 ssl http2;
    server_name _;  # 替换为你的域名或IP

    # SSL 证书配置（Let's Encrypt）
    # 如果有域名，使用以下配置（需要先运行 certbot）
    # ssl_certificate /etc/letsencrypt/live/你的域名/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/你的域名/privkey.pem;
    
    # SSL 证书配置（自签名证书，仅IP地址时使用）
    # 需要先运行: sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/ssl/nginx-selfsigned.key -out /etc/nginx/ssl/nginx-selfsigned.crt
    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 静态文件（HTML, CSS, JS）
    location / {
        root /opt/h5project/static;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # 图片文件（直接由Nginx服务，不经过Go）
    location /images/ {
        root /opt/h5project;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # 限制文件大小
        client_max_body_size 10M;
    }

    # API 请求转发到 Go 服务器
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 日志
    access_log /var/log/nginx/h5project_access.log;
    error_log /var/log/nginx/h5project_error.log;
}

